name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests (offline demo model, no API key needed)
        run: uv run pytest -q

      - name: Agent smoke run over stdio
        run: uv run helpdesk-agent --db /tmp/helpdesk.db --yes "Triage the urgent open tickets"
